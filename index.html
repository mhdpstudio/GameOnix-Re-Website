<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover games, explore PC and PlayStation collections, and build your gaming library with GameOnix."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="canonical" href="https://www.gameonix.shop/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GameOnix" />
    <meta
      property="og:title"
      content="GameOnix | Discover and Explore Games"
    />
    <meta
      property="og:description"
      content="Discover games, explore PC and PlayStation collections, and build your gaming library with GameOnix."
    />
    <meta property="og:url" content="https://www.gameonix.shop/" />
    <meta
      property="og:image"
      content="https://www.gameonix.shop/game.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="GameOnix | Discover and Explore Games"
    />
    <meta
      name="twitter:description"
      content="Discover games, explore PC and PlayStation collections, and build your gaming library with GameOnix."
    />
    <meta
      name="twitter:image"
      content="https://www.gameonix.shop/game.jpg"
    />
    <title>GameOnix | Discover and Explore Games</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "GameOnix",
        "url": "https://www.gameonix.shop/",
        "description": "Discover games, explore PC and PlayStation collections, and build your gaming library with GameOnix.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.gameonix.shop/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
